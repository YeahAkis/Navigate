plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

group = project.group
version = project.version

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperapi}")
    compileOnly("me.clip:placeholderapi:${papi}")
}

tasks {
    runServer {
        minecraftVersion("1.21.11")
        jvmArgs("-Dcom.mojang.eula.agree=true")
    }

    build { dependsOn("apiJar") }
}

tasks.register("apiJar", Jar) {
    from(sourceSets.main.output) {
        include "org/notionsmp/navigate/Navigate.class"
        include "org/notionsmp/navigate/Navigation.class"
        include "org/notionsmp/navigate/NavigationService.class"
    }
    archiveClassifier.set("api")
}
def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}


String changelogFor(String text, String ver) {
    List<String> section = []
    boolean inside = false
    for (String line : text.readLines()) {
        if (line.startsWith('## ')) {
            if (inside) {
                break
            }
            inside = line.substring(3).trim() == ver
        } else if (inside) {
            section.add(line)
        }
    }
    String entry = section.join('\n').trim()
    if (entry.isEmpty()) {
        throw new GradleException("CHANGELOG.md has no entry for ${ver}")
    }
    return entry
}

def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse(providers.gradleProperty('modrinthToken')).filter { !it.isBlank() }
def rehearsal = !modrinthToken.present

publishMods {
    file = tasks.jar.archiveFile
    version = project.version.toString()
    displayName = "Navigate ${project.version}"
    changelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { changelogFor(it, project.version.toString()) }
    type = project.version.toString().contains('alpha') ? ALPHA : (project.version.toString().contains('beta') ? BETA : STABLE)
    modLoaders.addAll('paper', 'folia', 'purpur')
    dryRun = rehearsal

    modrinth {
        projectId = modrinthProjectId
        accessToken = modrinthToken
        minecraftVersionRange {
            start = minecraftVersionMin
            end = minecraftVersionMax
        }
    }
}

tasks.register('publishPlugin') {
    group = 'publishing'
    dependsOn tasks.build, tasks.publishMods
}
