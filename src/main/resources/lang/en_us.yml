help:
  header: "<color:#006565>Navigate</color> commands:"
  legend: "<gray><required> [optional]</gray>"
  start: "<yellow>/navigate start <x y z> [safe|unsafe] [follow] [materials]</yellow> <gray>-</gray> Start navigating to a position, follow moves you along the path"
  stop: "<yellow>/navigate stop</yellow> <gray>-</gray> Stop navigating"
  startfor: "<yellow>/navigate startfor <players> <x y z> [safe|unsafe] [follow] [materials]</yellow> <gray>-</gray> Start navigating other players"
  stopfor: "<yellow>/navigate stopfor <players></yellow> <gray>-</gray> Stop navigating other players"
  reload: "<yellow>/navigate reload</yellow> <gray>-</gray> Reload the config and languages"
  neofetch: "<yellow>/navigate neofetch</yellow> <gray>-</gray> Fun info about the plugin and server"

